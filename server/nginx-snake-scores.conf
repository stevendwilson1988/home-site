# Snake leaderboard API, proxied to the snake-scores service. Installed as
# /etc/nginx/snippets/snake-scores.conf by home-site/server/install.sh.
location /snake/api/ {
	access_log off;
	limit_req zone=snakescores burst=10 nodelay;
	client_max_body_size 1k;
	proxy_pass http://127.0.0.1:5003;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
}
