<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steve Wilson</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#12305a">
<script>
  // Pick the scroll-to-Snake theme before first paint: random, never the same twice in a row; ?theme=name forces one.
  (function () {
    var themes = ["wash", "night", "frost", "shore"], theme, last;
    try { theme = new URLSearchParams(location.search).get("theme"); } catch (e) {}
    if (themes.indexOf(theme) < 0) {
      try { last = localStorage.getItem("home-theme"); } catch (e) {}
      var pool = themes.filter(function (t) { return t !== last; });
      theme = pool[Math.floor(Math.random() * pool.length)];
      try { localStorage.setItem("home-theme", theme); } catch (e) {}
    }
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600&display=swap">
<style>
  /* Layout: full-bleed mountain-lake photo; the name draws itself in the sky, then the site links draw in below it. */
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --sky: #12305a;
    --ink: #ffffff;
    --shade: rgba(8, 22, 48, 0.55);
    --chip: rgba(8, 22, 48, 0.4);
    --chip-hover: rgba(8, 22, 48, 0.62);
    --display: "Comfortaa", "Varela Round", "Nunito", system-ui, sans-serif;
    --body: "Nunito", system-ui, sans-serif;
    --ease-draw: cubic-bezier(.55,.1,.3,1);
    --ease-rise: cubic-bezier(.2,.8,.2,1);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--sky);
    color: var(--ink);
    font-family: var(--body);
    overflow-x: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #scene {
    position: fixed; inset: -2%;
    background: var(--sky) url("/lake.jpg") center 45% / cover no-repeat;
    animation: drift 40s ease-in-out infinite alternate;
    transform-origin: 50% 40%;
  }
  @keyframes drift { from { transform: scale(1.02); } to { transform: scale(1.08) translateX(-0.8%); } }

  /* Gentle darkening behind the name and links so white text holds up against white clouds. */
  .halo {
    position: fixed; left: 0; right: 0; top: 0; height: 80%;
    background: radial-gradient(ellipse 65% 55% at 50% 40%, rgba(8, 22, 48, 0.34), transparent 72%);
    pointer-events: none;
  }

  main {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1.8rem, 5vh, 3rem);
    padding-block: 20vh 6rem;
  }
  .name-wrap { width: min(92vw, 980px); }
  #name {
    display: block;
    width: 100%; height: auto; overflow: visible;
    filter: drop-shadow(0 2px 3px var(--shade)) drop-shadow(0 6px 24px rgba(8, 22, 48, 0.45));
  }
  #name text {
    font-family: var(--display);
    font-weight: 700;
    font-size: 100px;
    fill: var(--ink);
    fill-opacity: 0;
    stroke: var(--ink);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .play #name text {
    animation:
      draw 1.3s var(--ease-draw) forwards,
      fill .8s ease forwards,
      rise 1.3s var(--ease-rise) forwards;
  }

  /* Site links: same draw-then-fill lettering, set in pills. */
  nav ul {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 0.75rem 0.9rem;
    max-width: 860px;
  }
  nav a {
    position: relative;
    display: block;
    padding: 0.7rem 1.25rem;
    border-radius: 999px;
    color: var(--ink);
    text-decoration: none;
    filter: drop-shadow(0 2px 6px rgba(8, 22, 48, 0.35));
    transition: transform .25s var(--ease-rise);
  }
  nav a::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: var(--chip);
    border: 1px solid rgba(255, 255, 255, 0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    transform: scale(0.92);
    transition: background .25s ease;
  }
  nav a:hover::before { background: var(--chip-hover); }
  nav a:hover { transform: translateY(-2px); }
  nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  nav svg { display: block; height: 1.15rem; overflow: visible; position: relative; }
  nav text {
    font-family: var(--display);
    font-weight: 700;
    font-size: 40px;
    fill: var(--ink);
    fill-opacity: 0;
    stroke: var(--ink);
    stroke-width: 1;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  nav li { opacity: 0; }
  .play nav li { animation: rise 1.1s var(--ease-rise) forwards, appear .5s ease forwards; animation-delay: var(--d); }
  .play nav a::before { animation: chip .9s var(--ease-rise) forwards; animation-delay: calc(var(--d) + .35s); }
  .play nav text {
    animation: draw 1.1s var(--ease-draw) forwards, fill-sm .7s ease forwards;
    animation-delay: var(--d), calc(var(--d) + .6s);
  }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fill { from { fill-opacity: 0; } to { fill-opacity: 1; stroke-width: 0.4; } }
  @keyframes fill-sm { from { fill-opacity: 0; } to { fill-opacity: 1; stroke-width: 0.2; } }
  @keyframes rise { from { transform: translateY(14px); } to { transform: translateY(0); } }
  @keyframes appear { to { opacity: 1; } }
  @keyframes chip { to { opacity: 1; transform: scale(1); } }

  #replay {
    position: fixed;
    right: calc(16px + env(safe-area-inset-right, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    font: 600 0.85rem var(--body);
    color: var(--ink);
    background: var(--chip);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 999px;
    padding: 0.55rem 1rem;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  #replay:hover { background: var(--chip-hover); }
  #replay:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* Scroll down: the lake washes out to white and a game of Snake rises into the foreground.
     snake.js drives --wash, --reveal-copy, --reveal-board and --cue (0..1) from scroll position. */
  :root { --wash: 0; --reveal-copy: 0; --reveal-board: 0; --cue: 1; --navy: #12305a; --navy-soft: #4f6a8f; }

  /* Themes, one picked at random per load by the script in <head>. "wash" is the original look and the
     fallback. snake.js reads --snake, --snake-head, --food and --grid when the game starts. */
  :root, :root[data-theme="wash"] {
    --wash-bg: #fff;
    --stage-ink: var(--navy); --stage-soft: var(--navy-soft); --best: var(--stage-ink);
    --board-bg: #f4f7fb; --grid: #ebf0f7;
    --board-ring: 0 0 0 1px rgba(18, 48, 90, .08);
    --board-shadow: 0 40px 80px -40px rgba(18, 48, 90, .45), 0 12px 24px -12px rgba(18, 48, 90, .18);
    --snake: #7d9cc4; --snake-head: #12305a; --food: #ef7b54;
    --overlay: rgba(244, 247, 251, .62);
    --btn-bg: var(--navy); --btn-ink: #fff; --btn-hover: #1b4278;
    --kbd-bg: #fff; --kbd-border: #d5deea; --kbd-ink: inherit;
  }

  /* Night Dive: the lake sinks into deep water. */
  :root[data-theme="night"] {
    --wash-bg: #0b1a33;
    --stage-ink: #ffffff; --stage-soft: #9fb6d6; --best: #ffb27a;
    --board-bg: #13284a; --grid: rgba(159, 182, 214, .07);
    --board-ring: 0 0 0 1px rgba(159, 182, 214, .22);
    --board-shadow: 0 40px 80px -40px rgba(0, 0, 0, .6);
    --snake: #5fd3c4; --snake-head: #a8f0e6; --food: #ffb27a;
    --overlay: rgba(19, 40, 74, .62);
    --btn-bg: #5fd3c4; --btn-ink: #0b1a33; --btn-hover: #7fe0d3;
    --kbd-bg: #13284a; --kbd-border: rgba(159, 182, 214, .3); --kbd-ink: #fff;
  }
  :root[data-theme="night"] #scene { translate: 0 calc(var(--wash) * -4vh); }

  /* Frosted Lake: the photo blurs behind a dark tint and the board is frosted glass. */
  :root[data-theme="frost"] {
    --wash-bg: rgba(8, 22, 48, .5);
    --stage-ink: #fff; --stage-soft: #dbe5f2; --best: #fff;
    --board-bg: rgba(8, 22, 48, .55); --grid: rgba(255, 255, 255, .06);
    --board-ring: 0 0 0 1px rgba(255, 255, 255, .3);
    --board-shadow: 0 40px 80px -40px rgba(0, 0, 0, .55);
    --snake: #ffffff; --snake-head: #ffffff; --food: #ffc861;
    --overlay: rgba(8, 22, 48, .45);
    --btn-bg: #fff; --btn-ink: #12305a; --btn-hover: #e3ecf7;
    --kbd-bg: rgba(255, 255, 255, .12); --kbd-border: rgba(255, 255, 255, .3); --kbd-ink: #fff;
  }
  :root[data-theme="frost"] #scene { filter: blur(calc(var(--wash) * 14px)); }
  :root[data-theme="frost"] .play-board-wrap { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  :root[data-theme="frost"] .play-copy { text-shadow: 0 1px 14px rgba(8, 22, 48, .55); }

  /* Shore: a solid panel with a mountain-ridge top edge slides up over the full-color photo as you scroll. */
  :root[data-theme="shore"] {
    --stage-ink: #12305a; --stage-soft: #5a6b80; --best: #12305a;
    --board-bg: #ffffff; --grid: rgba(18, 48, 90, .05);
    --board-ring: 0 0 0 1px rgba(18, 48, 90, .1);
    --board-shadow: 0 40px 80px -40px rgba(18, 48, 90, .4);
    --snake: #12305a; --snake-head: #2a5a8e; --food: #c4552f;
    --overlay: rgba(255, 255, 255, .62);
    --btn-bg: var(--navy); --btn-ink: #fff; --btn-hover: #1b4278;
    --kbd-bg: #fff; --kbd-border: #d5deea; --kbd-ink: inherit;
  }
  :root[data-theme="shore"] #wash { display: none; }
  :root[data-theme="shore"] #play-runway {
    background: #f5f1ea;
    margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  }
  :root[data-theme="shore"] #play-runway::before {
    content: ""; position: absolute; left: 0; right: 0;
    top: -12vh; height: calc(12vh + 1px);   /* 1px overlap so no seam shows against the panel */
    background: #f5f1ea;
    clip-path: polygon(0 100%, 0 62%, 12% 30%, 24% 58%, 38% 4%, 52% 50%, 64% 22%, 80% 66%, 92% 36%, 100% 52%, 100% 100%);
  }

  #wash {
    position: fixed; inset: 0; z-index: 2;
    background: var(--wash-bg);
    opacity: var(--wash);
    pointer-events: none;
  }
  main { z-index: 1; }
  #replay { z-index: 1; transition: opacity .4s ease; }
  .lights-on #replay { opacity: 0; pointer-events: none; }
  #play-runway { position: relative; z-index: 3; height: 150vh; }
  .play-stage {
    position: sticky; top: 0;
    height: 100vh; height: 100svh;
    display: flex; align-items: center; justify-content: center;
    gap: clamp(2rem, 6vw, 5.5rem);
    color: var(--stage-ink);
    --board: min(600px, calc(100svh - 120px), calc(100vw - 440px));
  }
  .play-copy {
    width: 260px;
    opacity: var(--reveal-copy);
    transform: translateY(calc((1 - var(--reveal-copy)) * 40px));
  }
  .play-kicker {
    margin: 0 0 .6rem;
    font: 600 .78rem var(--body);
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--stage-soft);
  }
  .play-copy h2 {
    margin: 0 0 .9rem;
    font: 700 clamp(2.4rem, 5vw, 3.6rem) / 1 var(--display);
    letter-spacing: -.01em;
  }
  .play-sub { margin: 0 0 1.6rem; font-size: 1.05rem; line-height: 1.5; color: var(--stage-soft); }
  .play-score { display: flex; gap: 2.2rem; margin: 0 0 1.6rem; }
  .play-score dt { font: 600 .72rem var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--stage-soft); }
  .play-score dd { margin: .2rem 0 0; font: 700 2rem / 1 var(--display); font-variant-numeric: tabular-nums; }
  .play-score #snake-best { color: var(--best); }
  .play-help { margin: 0; font-size: .9rem; line-height: 1.55; color: var(--stage-soft); }
  .play-help kbd {
    display: inline-block; min-width: 1.6em; padding: 0 .35em;
    font: 600 .78rem/1.6 var(--body); text-align: center;
    border: 1px solid var(--kbd-border); border-bottom-width: 2px; border-radius: 6px;
    background: var(--kbd-bg); color: var(--kbd-ink);
  }
  .play-board-wrap {
    position: relative;
    flex: none;
    width: var(--board); aspect-ratio: 1;
    border-radius: 22px;
    overflow: hidden;
    background: var(--board-bg);
    box-shadow: var(--board-ring), var(--board-shadow);
    touch-action: pan-y;
    opacity: var(--reveal-board);
    transform: translateY(calc((1 - var(--reveal-board)) * 90px)) scale(calc(.94 + var(--reveal-board) * .06));
  }
  .play-board { position: absolute; inset: 0; }
  .play-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem;
    padding: 1.5rem; text-align: center;
    background: var(--overlay);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    transition: opacity .45s ease var(--overlay-delay, 0s);
  }
  .is-playing .play-overlay { opacity: 0; pointer-events: none; transition-delay: 0s; }
  #snake-msg { margin: 0; font: 700 1.15rem var(--display); color: var(--stage-ink); }
  #snake-btn {
    font: 700 1rem var(--display);
    color: var(--btn-ink); background: var(--btn-bg);
    border: 0; border-radius: 999px;
    padding: .85rem 2rem; min-height: 48px;
    cursor: pointer;
    box-shadow: 0 10px 24px -10px rgba(18, 48, 90, .7);
    transition: transform .2s var(--ease-rise), background .2s ease;
  }
  #snake-btn:hover { background: var(--btn-hover); transform: translateY(-2px); }
  #snake-btn:focus-visible { outline: 2px solid var(--btn-bg); outline-offset: 4px; }
  #snake-btn:disabled { opacity: .5; cursor: default; transform: none; }

  #scroll-cue {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: .3rem;
    font: 600 .8rem var(--body); letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink); text-shadow: 0 1px 6px rgba(8, 22, 48, .6);
    transform: translateX(-50%);
    opacity: var(--cue); pointer-events: none;
  }
  #scroll-cue > span { display: flex; flex-direction: column; align-items: center; gap: .3rem; opacity: 0; animation: appear 1s ease 3.6s forwards; }
  #scroll-cue svg { animation: nudge 2.2s ease-in-out infinite; filter: drop-shadow(0 1px 4px rgba(8, 22, 48, .6)); }
  @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

  @media (max-width: 860px) {
    .play-stage {
      flex-direction: column; gap: 1.1rem;
      --board: min(560px, calc(100vw - 32px), calc(100svh - 230px));
    }
    .play-copy { width: var(--board); text-align: center; }
    .play-copy h2 { font-size: 2.2rem; margin-bottom: .4rem; }
    .play-sub, .play-help, .play-kicker { display: none; }
    .play-score { justify-content: center; margin: 0; }
    .play-score dd { font-size: 1.6rem; }
  }

  @media (max-width: 520px) {
    main { padding-top: 14vh; }
    nav svg { height: 1rem; }
    #scroll-cue { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    #scene { animation: none; }
    .play #name text, .play nav text, .play nav li, .play nav a::before { animation: none; }
    #name text, nav text { fill-opacity: 1; stroke-dashoffset: 0 !important; stroke-width: 0.3; }
    nav li, nav a::before { opacity: 1; transform: none; }
    .play-copy, .play-board-wrap { transform: none; }
    #scroll-cue > span { animation: none; opacity: 1; }
    #scroll-cue svg { animation: none; }
    :root[data-theme="night"] #scene { translate: none; }
    :root[data-theme="frost"] #scene { filter: none; }
    /* shore without the sliding panel: the panel color fades in, as the other themes do */
    :root[data-theme="shore"] #wash { display: block; background: #f5f1ea; }
    :root[data-theme="shore"] #play-runway { background: none; }
    :root[data-theme="shore"] #play-runway::before { content: none; }
  }
</style>
</head>
<body>
<div id="scene" role="img" aria-label="A mountain reflected in a still lake under a blue sky with white clouds"></div>
<div class="halo" aria-hidden="true"></div>
<main id="stage">
  <h1 class="name-wrap" style="margin:0">
    <svg id="name" role="img" aria-label="Steve Wilson"></svg>
  </h1>
  <nav aria-label="Pages">
    <ul id="links">
      <li><a href="/whos-hacking-me/">Who's hacking scratchbuild.net?</a></li>
    </ul>
  </nav>
</main>
<button id="replay" type="button">Replay</button>
<div id="scroll-cue" aria-hidden="true"><span>Scroll to play
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
</div>
<div id="wash" aria-hidden="true"></div>

<section id="play-runway" aria-labelledby="play-title">
  <div class="play-stage">
    <div class="play-copy">
      <p class="play-kicker">Intermission</p>
      <h2 id="play-title">Snake</h2>
      <p class="play-sub">Eat, grow, and don't bite your own tail. It speeds up as you go.</p>
      <dl class="play-score">
        <div><dt>Score</dt><dd id="snake-score" aria-live="polite">0</dd></div>
        <div><dt>Best</dt><dd id="snake-best">0</dd></div>
      </dl>
      <p class="play-help"><kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer, swipe on touch screens, <kbd>Space</kbd> to pause.</p>
    </div>
    <div class="play-board-wrap" id="snake-wrap">
      <div class="play-board" id="snake-board" role="img" aria-label="Snake game board"></div>
      <div class="play-overlay">
        <p id="snake-msg">Warming up…</p>
        <button id="snake-btn" type="button" disabled>Play</button>
      </div>
    </div>
  </div>
</section>
<script src="/snake/snake.js" defer></script>

<script>
(() => {
  // Name comes from the link's #anchor (e.g. #Steve), otherwise the default.
  const DEFAULT_NAME = "Steve Wilson";
  const fromHash = decodeURIComponent(location.hash.slice(1)).replace(/[-_]+/g, " ").trim();
  const NAME = fromHash || DEFAULT_NAME;
  document.title = NAME;

  const NS = "http://www.w3.org/2000/svg";
  const stage = document.getElementById("stage");
  const svg = document.getElementById("name");
  svg.setAttribute("aria-label", NAME);

  // Name timing: letter i starts at i*STEP, fill finishes FILL_END after that.
  const STEP = 0.2, FILL_END = 0.9 + 0.8;
  // Links start this long before the name finishes, then follow each other.
  const LEAD = 0.6, LINK_STEP = 0.14;

  // Turn each link's text into an SVG label once, sized to its own text.
  const labels = [...document.querySelectorAll("#links a")].map(a => {
    const label = a.textContent;
    a.setAttribute("aria-label", label);
    a.textContent = "";
    const s = document.createElementNS(NS, "svg");
    s.setAttribute("aria-hidden", "true");
    const t = document.createElementNS(NS, "text");
    t.textContent = label;
    s.appendChild(t);
    a.appendChild(s);
    return { a, s, t };
  });

  function sizeLinks() {
    for (const { s, t } of labels) {
      const b = t.getBBox();
      const h = 52, y = 40;
      t.setAttribute("y", y);
      s.setAttribute("viewBox", `${b.x - 2} 0 ${b.width + 4} ${h}`);
      s.style.width = ((b.width + 4) / h * 1.15) + "em";
      s.style.height = "1.15em";
      const len = Math.ceil(t.getComputedTextLength() * 6);
      t.style.strokeDasharray = len;
      t.style.strokeDashoffset = len;
    }
  }

  function build() {
    stage.classList.remove("play");
    svg.replaceChildren();
    const gap = 4, space = 34;
    let x = 0, i = 0;
    for (const ch of NAME) {
      if (ch === " ") { x += space; continue; }
      const el = document.createElementNS(NS, "text");
      el.textContent = ch;
      el.setAttribute("y", "100");
      svg.appendChild(el);
      const w = el.getComputedTextLength();
      el.setAttribute("x", x);
      x += w + gap;
      el.style.strokeDasharray = 900;
      el.style.strokeDashoffset = 900;
      const delay = i * STEP;
      el.style.animationDelay = `${delay}s, ${delay + 0.9}s, ${delay}s`;
      i++;
    }
    svg.setAttribute("viewBox", `-10 0 ${Math.max(x - gap, 1) + 20} 130`);

    const nameEnd = (i - 1) * STEP + FILL_END;
    const linkStart = Math.max(0, nameEnd - LEAD);
    labels.forEach(({ a }, j) => a.parentElement.style.setProperty("--d", (linkStart + j * LINK_STEP).toFixed(2) + "s"));

    // Restart every animation cleanly (also used by Replay).
    void stage.offsetWidth;
    requestAnimationFrame(() => stage.classList.add("play"));
  }

  (document.fonts ? document.fonts.load('700 100px "Comfortaa"').then(() => document.fonts.ready) : Promise.resolve())
    .catch(() => {})
    .then(() => { sizeLinks(); build(); });
  document.getElementById("replay").addEventListener("click", build);
})();
</script>
</body>
</html>
